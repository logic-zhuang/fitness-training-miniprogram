<!DOCTYPE html>

<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-error-container": "#93000a", "surface-variant": "#d6e7da", "on-tertiary-container": "#ffe6d5", "tertiary": "#7d4200", "tertiary-fixed": "#ffdcc3", "primary-fixed-dim": "#80d8a6", "on-surface": "#111e17", "surface-dim": "#cdded2", "tertiary-container": "#a15600", "on-secondary-container": "#5c6761", "surface-container": "#e1f2e5", "on-primary-fixed-variant": "#005232", "on-primary-container": "#a3fdc8", "surface-container-lowest": "#ffffff", "inverse-primary": "#80d8a6", "on-surface-variant": "#3f4942", "surface-tint": "#006d44", "background": "#edfef0", "surface-bright": "#edfef0", "inverse-surface": "#25342b", "on-tertiary-fixed": "#2f1500", "primary-fixed": "#9cf5c1", "surface-container-high": "#dcecdf", "on-primary": "#ffffff", "on-secondary": "#ffffff", "on-tertiary": "#ffffff", "tertiary-fixed-dim": "#ffb77d", "inverse-on-surface": "#e4f5e8", "secondary-fixed-dim": "#bec9c3", "outline-variant": "#bec9bf", "on-secondary-fixed-variant": "#3f4944", "secondary-container": "#dae5de", "primary-container": "#18784e", "surface": "#edfef0", "on-tertiary-fixed-variant": "#6e3900", "on-primary-fixed": "#002111", "surface-container-highest": "#d6e7da", "secondary": "#56615b", "surface-container-low": "#e7f8eb", "on-secondary-fixed": "#141e1a", "error": "#ba1a1a", "outline": "#6f7a71", "secondary-fixed": "#dae5de", "on-background": "#111e17", "on-error": "#ffffff", "error-container": "#ffdad6", "primary": "#005e3a" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "gutter": "0.75rem", "margin": "1rem", "space-sm": "0.5rem", "space-xs": "0.25rem", "space-xl": "1.25rem", "space-lg": "1rem", "space-md": "0.75rem" }, fontFamily: { "headline-lg": ["Space Grotesk"], "data-unit": ["Plus Jakarta Sans"], "headline-sm": ["Space Grotesk"], "label-sm": ["Plus Jakarta Sans"], "data-display-md": ["Space Grotesk"], "body-lg": ["Plus Jakarta Sans"], "data-display-lg": ["Space Grotesk"], "title-md": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"] }, fontSize: { "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "data-unit": ["13px", { "lineHeight": "16px", "fontWeight": "500" }], "headline-sm": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "data-display-md": ["20px", { "lineHeight": "24px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "500" }], "data-display-lg": ["28px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "body-md": ["15px", { "lineHeight": "22px", "fontWeight": "400" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }] } } } }</script><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface font-body-md text-on-surface antialiased"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin flex items-center justify-between"><button aria-label="返回" class="w-11 h-11 -ml-2 flex items-center justify-center text-on-surface hover:text-primary transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-title-md text-title-md text-on-surface tracking-tight text-center truncate flex-1 px-space-sm">Auth</h1><div class="w-11 h-11 -mr-2 flex items-center justify-end"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-14 pb-safe bg-surface"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Brand / Header Section -->
<div class="flex flex-col items-center text-center mt-space-lg mb-space-xl">
<div class="w-14 h-14 rounded-xl bg-primary-container flex items-center justify-center shadow-sm mb-space-md">
<span class="material-symbols-outlined text-on-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-space-xs">训练手记</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs leading-relaxed">
      轻量、纯净、无干扰的私人训练记录工具
    </p>
</div>
<!-- Main Auth Card -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-sm p-space-lg flex flex-col gap-space-lg">
<!-- Tab Switcher -->
<div class="flex items-center justify-center relative pb-space-xs bg-surface-container-low rounded-lg p-1">
<button class="flex-1 py-space-sm rounded-md font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm font-semibold" id="tab-login" onclick="switchAuthMode('login')">
        登录
      </button>
<button class="flex-1 py-space-sm rounded-md font-label-md text-label-md transition-all duration-200 text-secondary hover:text-on-surface" id="tab-register" onclick="switchAuthMode('register')">
        注册新账号
      </button>
</div>
<!-- Auth Form -->
<form class="flex flex-col gap-space-md" novalidate="" onsubmit="handleAuthSubmit(event)">
<!-- Email Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">电子邮箱</label>
<div class="relative flex items-center bg-surface-container-low rounded-lg focus-within:bg-surface-container-lowest focus-within:shadow-[0_0_0_1.5px_#005e3a] transition-all">
<span class="material-symbols-outlined text-secondary ml-space-md text-[20px] pointer-events-none">mail</span>
<input class="w-full h-11 bg-transparent px-space-sm font-body-md text-body-md text-on-surface placeholder:text-secondary-fixed-dim outline-none" id="email" name="email" oninput="toggleClearEmail(this)" placeholder="trainer@university.edu.cn" type="email" value="alex.chen@stu.edu.cn"/>
<button aria-label="清空输入" class="w-11 h-11 flex items-center justify-center text-secondary hover:text-on-surface transition-colors" id="btn-clear-email" onclick="clearEmailInput()" type="button">
<span class="material-symbols-outlined text-[18px]">cancel</span>
</button>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">登录密码</label>
<div class="relative flex items-center bg-surface-container-low rounded-lg focus-within:bg-surface-container-lowest focus-within:shadow-[0_0_0_1.5px_#005e3a] transition-all">
<span class="material-symbols-outlined text-secondary ml-space-md text-[20px] pointer-events-none">lock</span>
<input class="w-full h-11 bg-transparent px-space-sm font-body-md text-body-md text-on-surface placeholder:text-secondary-fixed-dim outline-none tracking-wider" id="password" name="password" placeholder="请输入 6 位以上密码" type="password" value="••••••••••••"/>
<button aria-label="切换密码明文" class="w-11 h-11 flex items-center justify-center text-secondary hover:text-on-surface transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password Field (Dynamic for Register) -->
<div class="hidden flex flex-col gap-space-xs" id="confirm-password-container">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="confirm-password">确认密码</label>
<div class="relative flex items-center bg-surface-container-low rounded-lg focus-within:bg-surface-container-lowest focus-within:shadow-[0_0_0_1.5px_#005e3a] transition-all">
<span class="material-symbols-outlined text-secondary ml-space-md text-[20px] pointer-events-none">lock_reset</span>
<input class="w-full h-11 bg-transparent px-space-sm font-body-md text-body-md text-on-surface placeholder:text-secondary-fixed-dim outline-none tracking-wider" id="confirm-password" name="confirmPassword" placeholder="请再次确认密码" type="password"/>
</div>
</div>
<!-- Remember & Forgot Password -->
<div class="flex items-center justify-between pt-space-xs" id="login-auxiliary">
<label class="flex items-center gap-space-xs cursor-pointer select-none">
<input checked="" class="hidden peer" id="remember-me" type="checkbox"/>
<div class="w-5 h-5 rounded bg-surface-container-high peer-checked:bg-primary flex items-center justify-center transition-all">
<span class="material-symbols-outlined text-on-primary text-[14px] opacity-0 peer-checked:opacity-100 font-bold">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">保持登录状态</span>
</label>
<button class="font-label-sm text-label-sm text-primary hover:underline transition-all" type="button">
          忘记密码？
        </button>
</div>
<!-- Security / Local Storage Trust Badge -->
<div class="flex items-center gap-space-sm bg-surface-container-low px-space-md py-space-sm rounded-lg mt-space-xs">
<span class="material-symbols-outlined text-primary text-[18px]">verified_user</span>
<span class="font-label-sm text-label-sm text-primary">数据均在本地优先加密存储，纯粹安心</span>
</div>
<!-- Submit Action -->
<button class="w-full h-12 bg-primary hover:bg-primary-container active:scale-[0.99] text-on-primary font-body-lg text-body-lg rounded-xl flex items-center justify-center gap-space-xs transition-all shadow-sm font-semibold mt-space-xs" id="submit-btn" type="submit">
<span>立即登录</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Offline / Guest Mode Entry -->
<div class="flex flex-col items-center mt-space-lg">
<button class="group inline-flex items-center gap-space-xs py-space-sm px-space-md rounded-full bg-surface-container hover:bg-surface-variant transition-colors" onclick="handleGuestAccess()" type="button">
<span class="material-symbols-outlined text-primary text-[18px]">cloud_off</span>
<span class="font-label-md text-label-md text-primary font-medium group-hover:underline">
        无需账号，以本地离线访客模式试用 →
      </span>
</button>
<p class="font-label-sm text-label-sm text-secondary mt-space-xs">适合无网络健身房环境或即时快速测训</p>
</div>
<!-- Privacy & Regulatory Notice -->
<div class="mt-space-xl text-center px-space-md">
<p class="font-label-sm text-label-sm text-secondary leading-relaxed">
      点击登录即表示同意<a class="text-primary hover:underline" href="javascript:void(0)">《用户隐私声明》</a>。本产品严格遵循极简数据原则，不索取通讯录及外部无关权限，无公共社交信息流，训练容量与体态照片仅个人设备及授权私有空间可见。
    </p>
</div>
</div>
<script>
  let currentMode = 'login';

  function switchAuthMode(mode) {
    currentMode = mode;
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const confirmContainer = document.getElementById('confirm-password-container');
    const loginAuxiliary = document.getElementById('login-auxiliary');
    const submitBtn = document.getElementById('submit-btn');

    if (mode === 'register') {
      tabRegister.className = 'flex-1 py-space-sm rounded-md font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm font-semibold';
      tabLogin.className = 'flex-1 py-space-sm rounded-md font-label-md text-label-md transition-all duration-200 text-secondary hover:text-on-surface';
      confirmContainer.classList.remove('hidden');
      loginAuxiliary.classList.add('hidden');
      submitBtn.innerHTML = '<span>创建账号并开始</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
    } else {
      tabLogin.className = 'flex-1 py-space-sm rounded-md font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm font-semibold';
      tabRegister.className = 'flex-1 py-space-sm rounded-md font-label-md text-label-md transition-all duration-200 text-secondary hover:text-on-surface';
      confirmContainer.classList.add('hidden');
      loginAuxiliary.classList.remove('hidden');
      submitBtn.innerHTML = '<span>立即登录</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
    }
  }

  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function toggleClearEmail(input) {
    const clearBtn = document.getElementById('btn-clear-email');
    if (input.value.length > 0) {
      clearBtn.classList.remove('opacity-0', 'pointer-events-none');
    } else {
      clearBtn.classList.add('opacity-0', 'pointer-events-none');
    }
  }

  function clearEmailInput() {
    const emailInput = document.getElementById('email');
    emailInput.value = '';
    emailInput.focus();
    toggleClearEmail(emailInput);
  }

  function handleAuthSubmit(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const btn = document.getElementById('submit-btn');
    if (!email) return;

    btn.disabled = true;
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span><span>正在安全校验...</span>';
    
    setTimeout(() => {
      btn.disabled = false;
      btn.innerHTML = originalText;
    }, 1200);
  }

  function handleGuestAccess() {
    const guestNotice = document.createElement('div');
    guestNotice.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-space-lg py-space-sm rounded-full text-label-sm shadow-lg flex items-center gap-space-xs z-50 animate-fade-in';
    guestNotice.innerHTML = '<span class="material-symbols-outlined text-[16px] text-primary-fixed">check_circle</span> 正在进入离线沙盒空间...';
    document.body.appendChild(guestNotice);
    setTimeout(() => guestNotice.remove(), 2500);
  }
</script></main></body></html>
