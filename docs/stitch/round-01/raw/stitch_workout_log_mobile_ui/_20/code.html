<script>

    const feedback = document.createElement('div');
    feedback.className = 'fixed bottom-20 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-4 py-2 rounded-lg font-label-sm text-label-sm shadow-md transition-all duration-300 pointer-events-none opacity-0';
    feedback.innerText = '已重置所有过滤筛选条件';
    document.body.appendChild(feedback);
    requestAnimationFrame(() => {
      feedback.classList.remove('opacity-0');
      feedback.classList.add('opacity-100');
    });

      feedback.classList.add('opacity-0');
