<!-- 交互脚本与业务逻辑 -->
<script>
    // 训练时长累加器
    let workoutSeconds = 2061; // 00:34:21
    const timerEl = document.getElementById('workoutTimer');
    setInterval(() => {
      workoutSeconds++;
      const h = String(Math.floor(workoutSeconds / 3600)).padStart(2, '0');
      const m = String(Math.floor((workoutSeconds % 3600) / 60)).padStart(2, '0');
      const s = String(workoutSeconds % 60).padStart(2, '0');
      if (timerEl) {
        timerEl.textContent = `${h}:${m}:${s}`;
      }
    }, 1000);

    // 键盘数值管理
    let currentInput = "37.5";
    const weightDisplay = document.getElementById('activeWeightDisplay');

    function updateDisplay() {
      if (weightDisplay) {
        weightDisplay.textContent = currentInput || "0";
      }
    }

    function pressKey(key) {
      if (key === '.' && currentInput.includes('.')) return;
      if (currentInput === '0' && key !== '.') {
        currentInput = key;
      } else {
        currentInput += key;
      }
      updateDisplay();
    }

    function pressBackspace() {
      if (currentInput.length > 0) {
        currentInput = currentInput.slice(0, -1);
      }
      updateDisplay();
    }

    function stepWeight(delta) {
      let val = parseFloat(currentInput) || 0;
      val = Math.max(0, val + delta);
      currentInput = Number.isInteger(val) ? String(val) : val.toFixed(val % 0.5 === 0 ? 1 : 2);
      updateDisplay();
    }

    function pressFillLast() {
      currentInput = "35";
      updateDisplay();
    }

    function pressCopyPrevSet() {
      currentInput = "35";
      updateDisplay();
      const repsDisplay = document.getElementById('activeRepsDisplay');
      if (repsDisplay) repsDisplay.textContent = "12";
    }

    function confirmCurrentSet() {
      alert(`第 2 组已确认：${currentInput || '37.5'} kg × 10 次，开始休息倒计时 90s！`);
    }

    function switchTarget(direction) {
      // 可以在重量与次数之间切换聚焦
      const statusTitle = document.querySelector('aside .h-11 span.text-\\[\\#18784E\\]');
      if (statusTitle) {
        if (direction === 'next') {
          statusTitle.textContent = "第 2 组 · 次数";
        } else {
          statusTitle.textContent = "第 2 组 · 重量";
        }
      }
    }

    function dismissKeyboard() {
      const keyboard = document.querySelector('aside');
      if (keyboard) {
        keyboard.style.transform = keyboard.style.transform === 'translateY(100%)' ? 'translateY(0)' : 'translateY(100%)';
        keyboard.style.transition = 'transform 0.25s ease-out';
      }
    }

    function confirmAbandon() {
      if (confirm("确定要放弃本次训练吗？所有未保存的记录将丢失。建议点击【退出 (存草稿)】保存。")) {
        history.back();
      }
    }
  </script>
</body></html>
