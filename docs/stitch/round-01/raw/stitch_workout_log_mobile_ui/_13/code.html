<!DOCTYPE html>

<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "inverse-primary": "#80d8a6", "primary-container": "#18784e", "on-secondary-fixed": "#141e1a", "on-secondary-container": "#5c6761", "surface-container-low": "#e7f8eb", "surface-container-highest": "#d6e7da", "tertiary-fixed": "#ffdcc3", "tertiary-container": "#a15600", "outline": "#6f7a71", "on-tertiary-container": "#ffe6d5", "on-tertiary-fixed": "#2f1500", "secondary": "#56615b", "surface-container-lowest": "#ffffff", "background": "#edfef0", "on-tertiary": "#ffffff", "error": "#ba1a1a", "surface": "#edfef0", "inverse-surface": "#25342b", "outline-variant": "#bec9bf", "surface-bright": "#edfef0", "on-primary-fixed-variant": "#005232", "secondary-fixed": "#dae5de", "primary-fixed": "#9cf5c1", "secondary-container": "#dae5de", "surface-variant": "#d6e7da", "on-surface-variant": "#3f4942", "surface-container-high": "#dcecdf", "surface-dim": "#cdded2", "primary": "#005e3a", "on-error-container": "#93000a", "on-primary-fixed": "#002111", "on-tertiary-fixed-variant": "#6e3900", "on-primary": "#ffffff", "tertiary-fixed-dim": "#ffb77d", "on-background": "#111e17", "surface-tint": "#006d44", "on-primary-container": "#a3fdc8", "on-secondary-fixed-variant": "#3f4944", "on-error": "#ffffff", "secondary-fixed-dim": "#bec9c3", "primary-fixed-dim": "#80d8a6", "on-surface": "#111e17", "tertiary": "#7d4200", "inverse-on-surface": "#e4f5e8", "error-container": "#ffdad6", "surface-container": "#e1f2e5", "on-secondary": "#ffffff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "gutter": "0.75rem", "space-xl": "1.25rem", "space-xs": "0.25rem", "space-md": "0.75rem", "space-lg": "1rem", "space-sm": "0.5rem", "margin": "1rem" }, fontFamily: { "data-unit": ["Plus Jakarta Sans"], "data-display-md": ["Space Grotesk"], "label-md": ["Plus Jakarta Sans"], "headline-sm": ["Space Grotesk"], "label-sm": ["Plus Jakarta Sans"], "headline-lg": ["Space Grotesk"], "body-md": ["Plus Jakarta Sans"], "title-md": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "data-display-lg": ["Space Grotesk"] }, fontSize: { "data-unit": ["13px", { "lineHeight": "16px", "fontWeight": "500" }], "data-display-md": ["20px", { "lineHeight": "24px", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "headline-sm": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-md": ["15px", { "lineHeight": "22px", "fontWeight": "400" }], "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "500" }], "data-display-lg": ["28px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }] } } } };</script><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;background-color:#edfef0;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-gutter flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="返回" class="w-11 h-11 flex items-center justify-center rounded-lg text-on-surface hover:bg-surface-container active:bg-surface-container-high transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-title-md text-title-md text-on-surface tracking-tight">Active Workout</h1></div><div class="flex items-center"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col w-full px-margin pt-14 pb-safe bg-surface"><div class="flex flex-col w-full pb-[350px]"></div>
<script>
  let seconds = 2058;
  const timerElement = document.getElementById('sessionTimer');
  setInterval(() => {
    seconds++;
    const h = String(Math.floor(seconds / 3600)).padStart(2, '0');
    const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    if (timerElement) {
      timerElement.textContent = `${h}:${m}:${s}`;
    }
  }, 1000);

  let restSeconds = 75;
  const restElement = document.getElementById('restCounter');
  let restInterval = setInterval(() => {
    if (restSeconds > 0) {
      restSeconds--;
      const m = String(Math.floor(restSeconds / 60)).padStart(2, '0');
      const s = String(restSeconds % 60).padStart(2, '0');
      if (restElement) restElement.textContent = `${m}:${s}`;
    }
  }, 1000);

  function addRestTime(added) {
    restSeconds += added;
    const m = String(Math.floor(restSeconds / 60)).padStart(2, '0');
    const s = String(restSeconds % 60).padStart(2, '0');
    if (restElement) restElement.textContent = `${m}:${s}`;
  }

  function skipRest() {
    restSeconds = 0;
    const bar = document.getElementById('restTimerBar');
    if (bar) bar.classList.add('opacity-40');
    if (restElement) restElement.textContent = '00:00';
  }

  function adjustValue(inputId, delta) {
    const el = document.getElementById(inputId);
    if (!el) return;
    let val = parseFloat(el.value) || 0;
    val = Math.max(0, val + delta);
    el.value = Number.isInteger(val) ? val : val.toFixed(1);
  }

  function completeSet(setNum) {
    const row = document.querySelector(`[data-set="${setNum}"]`);
    const btn = document.getElementById(`setCheckBtn${setNum}`);
    if (row && btn) {
      row.classList.remove('bg-surface-container-lowest', 'bg-surface-container-low/50');
      row.classList.add('bg-surface-container-low');
      btn.classList.remove('bg-surface-container', 'bg-surface-container/50', 'text-primary', 'text-outline');
      btn.classList.add('bg-primary', 'text-on-primary');
      restSeconds = 90;
      const bar = document.getElementById('restTimerBar');
      if (bar) bar.classList.remove('opacity-40');
    }
  }

  function applyPrevWeight() {
    const w2 = document.getElementById('weightInput2');
    const r2 = document.getElementById('repsInput2');
    if (w2) w2.value = "35";
    if (r2) r2.value = "12";
  }

  const noteBtn = document.getElementById('toggleNoteBtn');
  const notePanel = document.getElementById('exerciseNotePanel');
  const noteChevron = document.getElementById('noteChevron');
  if (noteBtn && notePanel) {
    noteBtn.addEventListener('click', () => {
      const isHidden = notePanel.classList.toggle('hidden');
      if (noteChevron) {
        noteChevron.textContent = isHidden ? 'expand_more' : 'expand_less';
      }
    });
  }

  const copyBtn = document.getElementById('copyPrevBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', () => {
      applyPrevWeight();
    });
  }

  const addSetBtn = document.getElementById('addSetBtn');
  if (addSetBtn) {
    let nextSetIdx = 4;
    addSetBtn.addEventListener('click', () => {
      const container = document.getElementById('setsContainer');
      if (!container) return;
      const row = document.createElement('div');
      row.className = 'grid grid-cols-12 gap-2 items-center p-2 rounded-xl bg-surface-container-low/50';
      row.setAttribute('data-set', nextSetIdx);
      row.innerHTML = `
        <div class="col-span-2 flex items-center justify-center">
          <span class="w-7 h-7 rounded-full bg-surface-container text-on-surface-variant font-headline-sm text-headline-sm flex items-center justify-center">${nextSetIdx}</span>
        </div>
        <div class="col-span-4 flex items-center bg-surface-container/60 rounded-lg px-2 h-11">
          <button type="button" onclick="adjustValue('weightInput${nextSetIdx}', -2.5)" aria-label="减小重量" class="w-8 h-8 flex items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-transform">
            <span class="material-symbols-outlined text-[18px]">remove</span>
          </button>
          <input id="weightInput${nextSetIdx}" type="number" step="0.5" value="37.5" class="w-full bg-transparent text-center font-data-display-md text-data-display-md text-on-surface focus:outline-none" />
          <button type="button" onclick="adjustValue('weightInput${nextSetIdx}', 2.5)" aria-label="增加重量" class="w-8 h-8 flex items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-transform">
            <span class="material-symbols-outlined text-[18px]">add</span>
          </button>
        </div>
        <div class="col-span-4 flex items-center bg-surface-container/60 rounded-lg px-2 h-11">
          <button type="button" onclick="adjustValue('repsInput${nextSetIdx}', -1)" aria-label="减少次数" class="w-8 h-8 flex items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-transform">
            <span class="material-symbols-outlined text-[18px]">remove</span>
          </button>
          <input id="repsInput${nextSetIdx}" type="number" step="1" value="10" class="w-full bg-transparent text-center font-data-display-md text-data-display-md text-on-surface focus:outline-none" />
          <button type="button" onclick="adjustValue('repsInput${nextSetIdx}', 1)" aria-label="增加次数" class="w-8 h-8 flex items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-transform">
            <span class="material-symbols-outlined text-[18px]">add</span>
          </button>
        </div>
        <div class="col-span-2 flex items-center justify-center">
          <button id="setCheckBtn${nextSetIdx}" type="button" onclick="completeSet(${nextSetIdx})" aria-label="完成第${nextSetIdx}组" class="w-11 h-11 rounded-full bg-surface-container/50 hover:bg-surface-container active:scale-95 text-outline flex items-center justify-center transition-all">
            <span class="material-symbols-outlined text-[20px]">check</span>
          </button>
        </div>
      `;
      container.appendChild(row);
      nextSetIdx++;
    });
  }

  function confirmAbandon() {
    if (confirm("确定要放弃本次训练记录吗？草稿将不会被保存。")) {
      history.back();
    }
  }
</script></main></body></html>
